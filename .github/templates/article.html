<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- generated from articles/src/{{slug}}.md by .github/scripts/render-articles.mjs; edit the source, not this file -->
<title>{{title}} — SyncroDoc</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://syncrodocsystems.com/articles/{{slug}}.html">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{card}}">
<meta property="article:published_time" content="{{date_iso}}">{{modified_meta}}
<meta property="og:type" content="article">
<meta property="og:site_name" content="SyncroDoc Systems">
<meta name="robots" content="index, follow, max-snippet:-1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../article.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{title_json}},
  "datePublished": "{{date_iso}}",{{modified_json}}
  "author": {{author_json}},
  "publisher": {"@type": "Organization", "name": "SyncroDoc Systems LLC"},
  "mainEntityOfPage": "https://syncrodocsystems.com/articles/{{slug}}.html"
}
</script>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="../index.html"><img src="../logo.png" alt="SyncroDoc"></a>
    <div class="hdr-acts">
      <a class="tlink" href="../blog.html">Insights</a>
      <a class="btn amber" href="../index.html#start">Request access</a>
    </div>
  </div>
</header>

<article class="post">
  <div class="wrap">

    <p class="eyebrow">Insights</p>
    <h1>{{title}}</h1>
    <p class="byline">{{byline}} &nbsp;·&nbsp; <time datetime="{{date_iso}}">{{date_long}}</time></p>

{{body}}

    <div class="post-cta">
      <p>SyncroDoc reads a full set of plan documents, finds every difference, and cites the page behind each one.</p>
      <a class="btn amber" href="../index.html#start">See how it works</a>
    </div>

  </div>
</article>

<footer>
  <div class="wrap foot-in">
    <div>SyncroDoc Systems © <span id="yr">2026</span></div>
    <div><a href="../blog.html">All insights</a> &nbsp;·&nbsp; <a href="mailto:info@syncrodocsystems.com">info@syncrodocsystems.com</a></div>
  </div>
</footer>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
